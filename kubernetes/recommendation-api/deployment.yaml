apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-api
  namespace: library
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: recommendation-api
  template:
    metadata:
      labels:
        app: recommendation-api
    spec:
      containers:
      - name: recommendation-api
        image: katemic/library-recommendation:v0.1
        imagePullPolicy: Always
        env:
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: NEO4J_PASSWORD
        - name: RABBIT_USER
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: RABBIT_USER
        - name: RABBIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: RABBIT_PASSWORD
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_HTTP_PORTS
          value: '8080'
        - name: Neo4j__Uri
          value: bolt://recommendation-neo4j:7687
        - name: Neo4j__Username
          value: neo4j
        - name: Neo4j__Password
          value: $(NEO4J_PASSWORD)
        - name: RabbitMQ__Host
          value: rabbitmq
        - name: RabbitMQ__Port
          value: '5672'
        - name: RabbitMQ__Username
          value: $(RABBIT_USER)
        - name: RabbitMQ__Password
          value: $(RABBIT_PASSWORD)
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 750Mi
        readinessProbe:
          httpGet:
            path: /health/neo4j
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 15
