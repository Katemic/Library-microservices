apiVersion: v1
kind: Service
metadata:
  name: recommendation-neo4j
  namespace: library
spec:
  selector:
    app: recommendation-neo4j
  type: NodePort
  ports:
  - name: tcp-7474
    port: 7474
    targetPort: 7474
    nodePort: 30088
  - name: tcp-7687
    port: 7687
    targetPort: 7687
    nodePort: 30089
