apiVersion: v1
kind: ConfigMap
metadata:
  name: reservation-flyway-sql
  namespace: library
data:
  V1__initial_reservation_schema.sql: "\n-- Reservation initial relational schema\n-- No hardcoded Catalog item\
    \ seed records.\n\nCREATE TABLE `Item` (\n    `id` INT NOT NULL,\n    `name` VARCHAR(255) NOT NULL,\n    `isDeleted`\
    \ BOOLEAN NOT NULL DEFAULT FALSE,\n\n    -- Latest Catalog version processed\n    `item_version` BIGINT NOT\
    \ NULL DEFAULT 0,\n\n    -- Catalog's original deletion timestamp\n    `deleted_at_utc` DATETIME(6) NULL,\n\n\
    \    PRIMARY KEY (`id`)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n\nCREATE TABLE `Inventory` (\n    `id`\
    \ INT NOT NULL,\n    `status` ENUM(\n        'AVAILABLE',\n        'RESERVED',\n        'UNAVAILABLE'\n    )\
    \ NOT NULL DEFAULT 'AVAILABLE',\n\n    `barcode` VARCHAR(255) NOT NULL,\n    `placement` VARCHAR(255) NOT NULL,\n\
    \    `item` INT NOT NULL,\n\n    PRIMARY KEY (`id`),\n    UNIQUE KEY `uk_inventory_barcode` (`barcode`),\n\n\
    \    INDEX `idx_inventory_item` (`item`),\n\n    CONSTRAINT `fk_inventory_item`\n        FOREIGN KEY (`item`)\n\
    \        REFERENCES `Item` (`id`)\n        ON UPDATE CASCADE\n        ON DELETE RESTRICT\n) ENGINE=InnoDB DEFAULT\
    \ CHARSET=utf8mb4;\n\n\nCREATE TABLE `Reservation` (\n    `id` INT NOT NULL AUTO_INCREMENT,\n    `UserID` INT\
    \ NOT NULL,\n    `reservationTime` DATETIME NOT NULL,\n\n    `status` ENUM(\n        'PENDING',\n        'CONFIRMED',\n\
    \        'CANCELLED',\n        'COMPLETED'\n    ) NOT NULL DEFAULT 'PENDING',\n\n    `queueNumber` INT NOT NULL,\n\
    \    `item` INT NOT NULL,\n\n    PRIMARY KEY (`id`),\n\n    INDEX `idx_reservation_user` (`UserID`),\n    INDEX\
    \ `idx_reservation_time` (`reservationTime`),\n    INDEX `idx_reservation_item` (`item`),\n\n    CONSTRAINT\
    \ `fk_reservation_item`\n        FOREIGN KEY (`item`)\n        REFERENCES `Item` (`id`)\n        ON UPDATE CASCADE\n\
    \        ON DELETE RESTRICT\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n"
