apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-api
  namespace: library
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loan-api
  template:
    metadata:
      labels:
        app: loan-api
    spec:
      containers:
      - name: loan-api
        image: katemic/library-loan:v0.1
        imagePullPolicy: Always
        env:
        - name: LOAN_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: LOAN_DB_PASSWORD
        - name: RABBIT_USER
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: RABBIT_USER
        - name: RABBIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: RABBIT_PASSWORD
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_HTTP_PORTS
          value: '8080'
        - name: ConnectionStrings__LoanWrite
          value: server=loan-mysql;port=3306;database=loan_write;user=loan_user;password=$(LOAN_DB_PASSWORD)
        - name: RabbitMq__Uri
          value: amqp://$(RABBIT_USER):$(RABBIT_PASSWORD)@rabbitmq:5672/
        - name: RabbitMq__Exchange
          value: loan.events
        - name: CatalogRabbitMq__Exchange
          value: catalog.events
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 750Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 15
