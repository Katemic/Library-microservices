
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-outbox-worker
  namespace: library

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: catalog-outbox-worker

  template:
    metadata:
      labels:
        app: catalog-outbox-worker

    spec:
      containers:
        - name: catalog-outbox-worker
          image: katemic/library-catalog:keda-v1
          imagePullPolicy: Always

          env:
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: CATALOG_DB_PASSWORD

            - name: CATALOG_MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: CATALOG_MONGO_USER

            - name: CATALOG_MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: CATALOG_MONGO_PASSWORD

            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: RABBIT_USER

            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: RABBIT_PASSWORD

            - name: ASPNETCORE_ENVIRONMENT
              value: Development

            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"

            - name: ConnectionStrings__CatalogWrite
              value: server=catalog-mysql;port=3306;database=catalog_write;user=catalog;password=$(CATALOG_DB_PASSWORD)

            - name: Mongo__ConnectionString
              value: mongodb://$(CATALOG_MONGO_USER):$(CATALOG_MONGO_PASSWORD)@catalog-mongodb:27017/?authSource=admin

            - name: Mongo__DatabaseName
              value: catalog_read

            - name: Mongo__CollectionName
              value: items

            - name: RabbitMq__Uri
              value: amqp://$(RABBIT_USER):$(RABBIT_PASSWORD)@rabbitmq:5672/

            - name: RabbitMq__Exchange
              value: catalog.events

            - name: Catalog__EnableOutboxWorker
              value: "true"

            - name: Logging__Console__FormatterName
              value: json

            - name: Logging__LogLevel__Microsoft
              value: Warning

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 750Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 15
