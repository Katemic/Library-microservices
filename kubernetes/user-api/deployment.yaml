apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: library
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-api
  template:
    metadata:
      labels:
        app: user-api
    spec:
      containers:
      - name: user-api
        image: katemic/library-user:v0.1
        imagePullPolicy: Always
        env:
        - name: USER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: USER_DB_PASSWORD
        - name: RABBIT_USER
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: RABBIT_USER
        - name: RABBIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: RABBIT_PASSWORD
        - name: KEYCLOAK_BACKEND_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: library-secrets
              key: KEYCLOAK_BACKEND_CLIENT_SECRET
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_HTTP_PORTS
          value: '8080'
        - name: ConnectionStrings__DefaultConnection
          value: Server=user-mysql;Port=3306;Database=userdb;User=userapp;Password=$(USER_DB_PASSWORD)
        - name: RabbitMQ__Host
          value: rabbitmq
        - name: RabbitMQ__Port
          value: '5672'
        - name: RabbitMQ__Username
          value: $(RABBIT_USER)
        - name: RabbitMQ__Password
          value: $(RABBIT_PASSWORD)
        - name: Keycloak__Authority
          value: http://localhost:30086/realms/Library
        - name: Keycloak__Audience
          value: library-userservice
        - name: Keycloak__InternalBaseUrl
          value: http://library-keycloak:8080
        - name: Keycloak__BackendClientId
          value: userservice-backend
        - name: Keycloak__BackendClientSecret
          value: $(KEYCLOAK_BACKEND_CLIENT_SECRET)
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 750Mi
