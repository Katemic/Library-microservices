
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: library

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: library-prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - nodes/metrics
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: library-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: library-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: library
