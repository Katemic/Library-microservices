# This is intentionally a single Deployment for a small Docker Desktop cluster.
# Alloy tails Catalog API and Outbox Worker pods using Kubernetes API
# (no hostPath mounts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: library
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-catalog-logs
  namespace: library
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-catalog-logs
  namespace: library
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-catalog-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: library
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: library
data:
  config.alloy: |
    // Discover both Catalog API and Outbox Worker pods.
    discovery.kubernetes "catalog_pods" {
      role = "pod"
      namespaces {
        names = ["library"]
      }
      selectors {
        role = "pod"
        label = "app in (catalog-api,catalog-outbox-worker)"
      }
    }

    discovery.relabel "catalog_logs" {
      targets = discovery.kubernetes.catalog_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        action = "keep"
        regex = "catalog-api|catalog-outbox-worker"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label = "job"
      }

      rule {
        target_label = "service"
        replacement = "catalog"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
    }

    loki.source.kubernetes "catalog" {
      targets = discovery.relabel.catalog_logs.output
      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: library
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        runAsNonRoot: true
      containers:
        - name: alloy
          image: grafana/alloy:v1.21.3
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/tmp/alloy
            - /etc/alloy/config.alloy
          ports:
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: tmp
              mountPath: /tmp/alloy
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: library
spec:
  type: ClusterIP
  selector:
    app: alloy
  ports:
    - name: http
      port: 12345
      targetPort: 12345