
name: library-catalog-loan-integration

services:

  # =====================================
  # Shared RabbitMQ
  # =====================================
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports:
      - "127.0.0.1:15675:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # =====================================
  # Catalog MySQL
  # =====================================
  catalog-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${CATALOG_ROOT_PASSWORD}
      MYSQL_DATABASE: catalog_write
      MYSQL_USER: catalog
      MYSQL_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # =====================================
  # Catalog Flyway
  # =====================================
  catalog-flyway:
    image: flyway/flyway:13.7.0
    command: migrate
    environment:
      FLYWAY_URL: "jdbc:mysql://catalog-mysql:3306/catalog_write?allowPublicKeyRetrieval=true&useSSL=false"
      FLYWAY_USER: catalog
      FLYWAY_PASSWORD: ${CATALOG_DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "60"
    volumes:
      - ./Catalog/Database/Migrations:/flyway/sql:ro
    depends_on:
      catalog-mysql:
        condition: service_healthy
    restart: "no"

  # =====================================
  # Catalog lookup test data
  # =====================================
  catalog-lookups:
    image: mysql:8.4
    environment:
      MYSQL_PWD: ${CATALOG_DB_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >
        exec mysql -h catalog-mysql -u catalog catalog_write
        < /seeds/lookups.sql
    volumes:
      - ./Catalog/Database/Seeds/integration_lookups.sql:/seeds/lookups.sql:ro
    depends_on:
      catalog-flyway:
        condition: service_completed_successfully
    restart: "no"

  # =====================================
  # Catalog MongoDB
  # =====================================
  catalog-mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CATALOG_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${CATALOG_MONGO_PASSWORD}
    volumes:
      - catalog_mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet
          --host catalog-mongodb
          --port 27017
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s


  # =====================================
  # MongoDB schema and indexes
  # =====================================
  catalog-mongo-setup:
    image: mongo:8
    environment:
      MONGO_USER: ${CATALOG_MONGO_USER}
      MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >
        exec mongosh --host catalog-mongodb
        --username "$$MONGO_USER"
        --password "$$MONGO_PASSWORD"
        --authenticationDatabase admin
        /scripts/setup.js
    volumes:
      - ./Catalog/Database/Mongo/setup.js:/scripts/setup.js:ro
    depends_on:
      catalog-mongodb:
        condition: service_healthy
    restart: "no"

  # =====================================
  # Loan MySQL
  # =====================================
  loan-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${LOAN_ROOT_PASSWORD}
      MYSQL_DATABASE: loan_write
      MYSQL_USER: loan_user
      MYSQL_PASSWORD: ${LOAN_DB_PASSWORD}
    volumes:
      - loan_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # =====================================
  # Loan Flyway
  # =====================================
  loan-flyway:
    image: flyway/flyway:13.7.0
    command: migrate
    environment:
      FLYWAY_URL: "jdbc:mysql://loan-mysql:3306/loan_write?allowPublicKeyRetrieval=true&useSSL=false"
      FLYWAY_USER: loan_user
      FLYWAY_PASSWORD: ${LOAN_DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "60"
    volumes:
      - ./Loan/Database/Migrations:/flyway/sql:ro
    depends_on:
      loan-mysql:
        condition: service_healthy
    restart: "no"

  # =====================================
  # Loan API and RabbitMQ consumer
  # =====================================
  loan-api:
    build:
      context: ./Loan
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__LoanWrite: "server=loan-mysql;port=3306;database=loan_write;user=loan_user;password=${LOAN_DB_PASSWORD}"

      RabbitMq__Uri: "amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672/"
      RabbitMq__Exchange: loan.events
      CatalogRabbitMq__Exchange: catalog.events

    depends_on:
      loan-flyway:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  # =====================================
  # Catalog API and outbox worker
  # =====================================
  catalog-api:
    build:
      context: ./Catalog
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__CatalogWrite: "server=catalog-mysql;port=3306;database=catalog_write;user=catalog;password=${CATALOG_DB_PASSWORD}"

      Mongo__ConnectionString: "mongodb://${CATALOG_MONGO_USER}:${CATALOG_MONGO_PASSWORD}@catalog-mongodb:27017/?authSource=admin"
      Mongo__DatabaseName: catalog_read
      Mongo__CollectionName: items

      RabbitMq__Uri: "amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672/"
      RabbitMq__Exchange: catalog.events

    depends_on:
      catalog-lookups:
        condition: service_completed_successfully
      catalog-mongo-setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

volumes:
  rabbit_data:
  catalog_mysql_data:
  catalog_mongo_data:
  loan_mysql_data:
