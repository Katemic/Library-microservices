
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reservation-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: reservation-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    restart: unless-stopped

  api:
    build:
      context: ./ReservationApi
      dockerfile: Dockerfile
    container_name: reservation-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ReservationDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
      - rabbitmq
    restart: unless-stopped

volumes:
  sql_data:
  rabbit_data:
