services:
  user-api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:18084:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      # Database connection
      ConnectionStrings__DefaultConnection: "Server=user-mysql;Port=3306;Database=userdb;User=userapp;Password=${USER_DB_PASSWORD}"

      # RabbitMQ connection
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBIT_USER}
      RabbitMQ__Password: ${RABBIT_PASSWORD}

      # Keycloak OAuth 2.0 / OpenID Connect configuration
      # Public issuer URL used for JWT validation
      Keycloak__Authority: "http://localhost:8081/realms/Library"

      # Expected audience of JWT access tokens
      Keycloak__Audience: "library-userservice"

      # Internal URL used to reach Keycloak from the container
      Keycloak__InternalBaseUrl: "http://library-keycloak:8080"

      # Backend client for reading and updating user attributes
      Keycloak__BackendClientId: ${KEYCLOAK_BACKEND_CLIENT_ID}
      Keycloak__BackendClientSecret: ${KEYCLOAK_BACKEND_CLIENT_SECRET}

    depends_on:
      user-mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      library-keycloak:
        condition: service_started

    restart: unless-stopped

  user-mysql:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: ${USER_ROOT_PASSWORD}
      MYSQL_DATABASE: userdb
      MYSQL_USER: userapp
      MYSQL_PASSWORD: ${USER_DB_PASSWORD}

    ports:
      - "127.0.0.1:3310:3306"

    volumes:
      - user_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >
          MYSQL_PWD="$$MYSQL_PASSWORD"
          mysql --protocol=TCP
          -h 127.0.0.1
          -u "$$MYSQL_USER"
          "$$MYSQL_DATABASE"
          -e 'SELECT 1' > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}

    ports:
      - "127.0.0.1:15675:15672"

    volumes:
      - rabbit_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  library-keycloak:
    image: quay.io/keycloak/keycloak:26.8.1

    command:
      - start-dev
      - --hostname=http://localhost:8081
      - --import-realm

    environment:
      # Keycloak administrator
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Backend client secret
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}

      # Optional Google login secret
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

    ports:
      - "127.0.0.1:8081:8080"

    volumes:
      # Keep Keycloak data between restarts
      - keycloak_data:/opt/keycloak/data

      # Automatically import the Library realm
      - ./keycloak/Library-realm.json:/opt/keycloak/data/import/Library-realm.json:ro

volumes:
  user_mysql_data:
  rabbit_data:
  keycloak_data:

