name: Loan CI/CD

# CI: builds and tests Loan on every push and pull request that touches it.
# CD: on master only, and only if the tests pass, builds the Loan Docker
#     image and pushes it to Docker Hub (same names as docker-publish.yml).
on:
  push:
    paths:
      - "Loan/**"
      - "LoanUnitTests/**"
      - ".github/workflows/loan-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "Loan/**"
      - "LoanUnitTests/**"
      - ".github/workflows/loan-ci.yml"
  # Lets you start the workflow by hand from the Actions tab.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Restoring and building the test project also builds Loan,
      # because the test project references it.
      - name: Restore
        run: dotnet restore LoanUnitTests/LoanUnitTests.csproj

      - name: Build
        run: dotnet build LoanUnitTests/LoanUnitTests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test LoanUnitTests/LoanUnitTests.csproj
          --configuration Release --no-build
          -- --report-trx --coverage --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/TestResults

      # Runs even when tests fail, so you can see what went wrong.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loan-test-results
          path: TestResults/

  docker-publish:
    name: Build and push Docker image
    # Waits for the tests; if they fail, this job never starts.
    needs: build-and-test
    # Only for master: pushes and manual runs, never pull requests.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # "latest" is always the newest tested version; the commit id
      # tag keeps every version, so you can go back to an older one.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Loan
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/library-loan:latest
            ${{ vars.DOCKERHUB_USERNAME }}/library-loan:${{ github.sha }}
