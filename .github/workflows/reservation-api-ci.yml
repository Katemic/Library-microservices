
name: Reservation API CI

on:
  push:
    paths:
      - 'ReservationAPIMicroservice/**'
      - 'ReservationAPIMicroserviceTests/**'
      - '.github/workflows/reservation-api-ci.yml'

  pull_request:
    paths:
      - 'ReservationAPIMicroservice/**'
      - 'ReservationAPIMicroserviceTests/**'
      - '.github/workflows/reservation-api-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  reservation-api-tests:
    name: Reservation API Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ReservationAPIMicroserviceTests/ReservationAPIMicroserviceTests.csproj

      - name: Build tests
        run: dotnet build ReservationAPIMicroserviceTests/ReservationAPIMicroserviceTests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ReservationAPIMicroserviceTests/ReservationAPIMicroserviceTests.csproj --configuration Release --no-build --no-restore --verbosity normal
