name: UserService CI/CD

on:
  push:
    branches:
      - user-profile-update
      - dev-integration-v1

  pull_request:
    branches:
      - dev-integration-v1

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore dependencies
      - name: Restore UserService
        run: dotnet restore UserService/UserService.csproj

      # Build UserService
      - name: Build UserService
        run: dotnet build UserService/UserService.csproj --configuration Release --no-restore

      # Run unit tests and generate test results
      - name: Run unit tests
        run: |
          dotnet test User.UnitTests/UserService.UnitTests.csproj \
            --configuration Release \
            --logger "console;verbosity=detailed" \
            --logger "trx;logfilename=results.trx" \
            --results-directory "$GITHUB_WORKSPACE/TestResults"

      # Display test results in GitHub Actions Summary
      - name: Generate test report
        if: always()
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "TestResults/results.trx"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("## UserService - Unit Test Report\n\n")

              if not os.path.exists(path):
                  report.write("No test results available.\n")
                  raise SystemExit(0)

              root = ET.parse(path).getroot()
              ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}

              counters = root.find(".//t:Counters", ns)

              report.write("| Total | Passed | Failed |\n")
              report.write("|---|---|---|\n")
              report.write(
                  f"| {counters.get('total')} "
                  f"| {counters.get('passed')} "
                  f"| {counters.get('failed')} |\n\n"
              )

              report.write("| Test | Result | Duration |\n")
              report.write("|---|---|---|\n")

              for test in root.findall(".//t:UnitTestResult", ns):
                  name = test.get("testName")
                  outcome = test.get("outcome")
                  duration = test.get("duration")

                  icon = "✅" if outcome == "Passed" else "❌" if outcome == "Failed" else "⚪"

                  report.write(
                      f"| {name} | {icon} {outcome} | {duration} |\n"
                  )
          PY

      # Save test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UserService-TestResults
          path: TestResults/
          if-no-files-found: warn
